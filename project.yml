name: DeepForest
options:
  bundleIdPrefix: com.vivek
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    CODE_SIGN_STYLE: Automatic
targets:
  DeepForest-iOS:
    type: application
    platform: iOS
    sources:
      - DeepForestApp
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vivek.deepforest
        INFOPLIST_FILE: DeepForestApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeepForestApp/DeepForest.entitlements
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: DeepForestWidget
        embed: true
  DeepForest-macOS:
    type: application
    platform: macOS
    sources:
      - DeepForestApp
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vivek.deepforest.mac
        INFOPLIST_FILE: DeepForestApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeepForestApp/DeepForest.entitlements
        CODE_SIGN_STYLE: Automatic
  DeepForestWidget:
    type: app-extension
    platform: iOS
    sources:
      - DeepForestWidget
      - Shared/Models/DeepForestModels.swift
      - Shared/Store/WidgetSnapshot.swift
      - Shared/Store/DeepForestBackup.swift
      - Shared/Views/ForestCanvasView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vivek.deepforest.widget
        INFOPLIST_FILE: DeepForestWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeepForestWidget/DeepForestWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
